# Temporary integration diagnostic workflow; remove before upstream submission.
name: BFSS warning diagnostics (not qualification)

on:
  push:
    branches: [contribution/bfss-lean-v040-20261105]
    paths:
      - lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/**
      - lean/OAI/MathematicalPhysics/BFSS/SpinPlaneCovariance.lean
      - .github/workflows/bfss-complete-contribution-diagnostics.yml
      - preprints/Positive-eigenvalues-of-the-relative-SU-2-BFSS-Hamiltonian-October-5-2026/NOTES.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warning-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            lean
            preprints/Positive-eigenvalues-of-the-relative-SU-2-BFSS-Hamiltonian-October-5-2026
          sparse-checkout-cone-mode: true
      - name: Check frozen source package and dependency order
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bfss-bundle"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bfss-bundle/tested-sha.txt"
          python3 lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/tools/check_bundle.py
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = contribution/bfss-lean-v040-20261105 ]; then
            python3 lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/tools/check_bundle.py --check-contribution-base
          fi
          python3 -m unittest discover -s lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/tools -p test_build_bundle.py
      - name: Restore pinned Lean and Mathlib
        timeout-minutes: 28
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          timeout 1500s lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Compile warning inventory without qualification
        timeout-minutes: 103
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/tools/build_bundle.py --diagnose-warnings --logs "$RUNNER_TEMP/bfss-bundle" 2>&1 | tee "$RUNNER_TEMP/bfss-bundle/build.log"
      - name: Preserve build result and exact source inventory
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/bfss-bundle"
          cp lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/manifest.json "$RUNNER_TEMP/bfss-bundle/"
          cp lean/OAI/MathematicalPhysics/BFSS/Contrib/Kotler/declarations.json "$RUNNER_TEMP/bfss-bundle/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bfss-warning-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bfss-bundle
          if-no-files-found: error
